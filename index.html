<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="container">
        <div class="app-header">
            <h1>My To-Do List</h1>
            <div class="user-section">
                <span id="userInfo">{{ userInfo ? `Logged in as: ${userInfo.username}` : 'Loading...' }}</span>
                <!-- VUE EVENT HANDLER: @click directive replaces addEventListener -->
                <!-- Instead of: logoutBtn.addEventListener('click', handleLogout) -->
                <!-- Vue's @click creates a declarative event binding right in the template -->
                <button @click="handleLogout" class="btn btn-logout">Logout</button>
            </div>
        </div>

        <div class="input-section">
            <!-- V-MODEL: Two-way data binding - the Vue superpower! -->
            <!-- v-model="newTaskText" creates a bidirectional connection: -->
            <!-- 1. When user types, newTaskText in Vue data updates automatically -->
            <!-- 2. When we set newTaskText = '' in code, the input clears automatically -->
            <!-- This replaces: input.value (reading) and input.value = '' (writing) -->

            <!-- @KEYPRESS.ENTER: Event handler with modifier -->
            <!-- The .enter modifier means "only trigger on Enter key" -->
            <!-- This replaces: input.addEventListener('keypress', e => { if (e.key === 'Enter') ... }) -->
            <input
                type="text"
                v-model="newTaskText"
                @keypress.enter="addTask"
                placeholder="Enter a new task..."
            />

            <!-- @CLICK: Click event handler -->
            <!-- Calls the addTask method when button is clicked -->
            <!-- This replaces: button.addEventListener('click', addTask) -->
            <button @click="addTask" class="btn btn-add">Add Task</button>
        </div>

        <div class="filter-section">
            <!-- :CLASS BINDING (shorthand for v-bind:class): Dynamic CSS classes -->
            <!-- Array syntax: ['static-class', { 'conditional-class': condition }] -->
            <!-- The 'active' class is added only when currentFilter === 'all' -->
            <!-- This replaces: button.classList.add/remove('active') in vanilla JS -->

            <!-- @CLICK WITH PARAMETER: Passing data to event handler -->
            <!-- setFilter('all') passes the filter name to the method -->
            <!-- This is cleaner than reading data-attributes in vanilla JS -->
            <button
                :class="['filter-btn', { active: currentFilter === 'all' }]"
                @click="setFilter('all')"
            >
                All
            </button>
            <button
                :class="['filter-btn', { active: currentFilter === 'active' }]"
                @click="setFilter('active')"
            >
                Active
            </button>
            <button
                :class="['filter-btn', { active: currentFilter === 'completed' }]"
                @click="setFilter('completed')"
            >
                Completed
            </button>
        </div>

        <ul id="taskList" class="task-list">
            <!-- V-FOR with COMPUTED PROPERTY: Now using filteredTasks instead of tasks -->
            <!-- This demonstrates Vue's reactivity chain: -->
            <!-- 1. User clicks filter button -->
            <!-- 2. @click updates currentFilter data -->
            <!-- 3. filteredTasks computed property automatically recalculates -->
            <!-- 4. v-for automatically re-renders the list with filtered results -->
            <!-- No manual DOM manipulation needed! -->
            <li v-for="task in filteredTasks" :key="task.id" class="task-item">
                <span>{{ task.text }}</span>
            </li>
        </ul>

        <div class="task-summary">
            <span id="taskCount">0 tasks</span>
            <button id="clearCompleted" class="btn btn-clear">Clear Completed</button>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="auth.js"></script>
    <script src="api-service.js"></script>
    <script src="vue-app.js"></script>
</body>
</html>
