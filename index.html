<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="container">
        <div class="app-header">
            <h1>My To-Do List</h1>
            <div class="user-section">
                <span id="userInfo">{{ userInfo ? `Logged in as: ${userInfo.username}` : 'Loading...' }}</span>
                <!-- VUE EVENT HANDLER: @click directive replaces addEventListener -->
                <!-- Instead of: logoutBtn.addEventListener('click', handleLogout) -->
                <!-- Vue's @click creates a declarative event binding right in the template -->
                <button @click="handleLogout" class="btn btn-logout">Logout</button>
            </div>
        </div>

        <div class="input-section">
            <!-- V-MODEL: Two-way data binding - the Vue superpower! -->
            <!-- v-model="newTaskText" creates a bidirectional connection: -->
            <!-- 1. When user types, newTaskText in Vue data updates automatically -->
            <!-- 2. When we set newTaskText = '' in code, the input clears automatically -->
            <!-- This replaces: input.value (reading) and input.value = '' (writing) -->

            <!-- @KEYPRESS.ENTER: Event handler with modifier -->
            <!-- The .enter modifier means "only trigger on Enter key" -->
            <!-- This replaces: input.addEventListener('keypress', e => { if (e.key === 'Enter') ... }) -->
            <input
                type="text"
                v-model="newTaskText"
                @keypress.enter="addTask"
                placeholder="Enter a new task..."
            />

            <!-- @CLICK: Click event handler -->
            <!-- Calls the addTask method when button is clicked -->
            <!-- This replaces: button.addEventListener('click', addTask) -->
            <button @click="addTask" class="btn btn-add">Add Task</button>
        </div>

        <div class="filter-section">
            <!-- :CLASS BINDING (shorthand for v-bind:class): Dynamic CSS classes -->
            <!-- Array syntax: ['static-class', { 'conditional-class': condition }] -->
            <!-- The 'active' class is added only when currentFilter === 'all' -->
            <!-- This replaces: button.classList.add/remove('active') in vanilla JS -->

            <!-- @CLICK WITH PARAMETER: Passing data to event handler -->
            <!-- setFilter('all') passes the filter name to the method -->
            <!-- This is cleaner than reading data-attributes in vanilla JS -->
            <button
                :class="['filter-btn', { active: currentFilter === 'all' }]"
                @click="setFilter('all')"
            >
                All
            </button>
            <button
                :class="['filter-btn', { active: currentFilter === 'active' }]"
                @click="setFilter('active')"
            >
                Active
            </button>
            <button
                :class="['filter-btn', { active: currentFilter === 'completed' }]"
                @click="setFilter('completed')"
            >
                Completed
            </button>
        </div>

        <ul id="taskList" class="task-list">
            <!-- V-IF: Conditional rendering for empty state -->
            <!-- Vue completely removes/adds this element from DOM based on condition -->
            <!-- This is different from v-show which just toggles display: none -->
            <!-- Use v-if when the element won't toggle frequently -->
            <div v-if="filteredTasks.length === 0" class="empty-state">
                No tasks to display
            </div>

            <!-- V-FOR: List rendering with complete CRUD functionality -->
            <!-- This demonstrates Vue's advanced templating features -->
            <li
                v-for="task in filteredTasks"
                :key="task.id"
                :class="['task-item', { completed: task.completed }]"
            >
                <!-- :CLASS BINDING EXPLAINED: -->
                <!-- Array syntax: ['static-class', { 'conditional-class': booleanCondition }] -->
                <!-- - 'task-item' is always applied -->
                <!-- - 'completed' is only applied when task.completed is true -->
                <!-- This enables the strikethrough styling for completed tasks -->
                <!-- Vue automatically adds/removes 'completed' when task.completed changes -->

                <!-- TOGGLE OPERATION: Checkbox for task completion -->
                <!-- :CHECKED binding: Reactive attribute binding (shorthand for v-bind:checked) -->
                <!-- The checkbox's checked state stays synced with task.completed -->
                <!-- @CHANGE event: Triggers when checkbox is clicked -->
                <!-- We pass task.id as parameter to identify which task to toggle -->
                <input
                    type="checkbox"
                    class="task-checkbox"
                    :checked="task.completed"
                    @change="toggleTask(task.id)"
                >

                <!-- CONDITIONAL RENDERING: Display mode vs Edit mode -->
                <!-- V-IF: Only renders when condition is true -->
                <!-- These two elements swap based on task.isEditing state -->

                <!-- DISPLAY MODE: Show task text when not editing -->
                <!-- V-IF vs V-SHOW: -->
                <!-- - v-if completely adds/removes element from DOM -->
                <!-- - v-show just toggles CSS display property -->
                <!-- Use v-if when toggling is infrequent (better for edit mode) -->
                <span v-if="!task.isEditing" class="task-text">{{ task.text }}</span>

                <!-- EDIT MODE: Show input field when editing -->
                <!-- V-MODEL: Two-way data binding on task.editText -->
                <!-- As user types, task.editText updates automatically -->
                <!-- @KEYPRESS.ENTER: Event modifier for Enter key -->
                <!-- @KEYUP.ESC: Event modifier for Escape key -->
                <!-- These modifiers are Vue's shorthand for checking event.key -->
                <input
                    v-if="task.isEditing"
                    v-model="task.editText"
                    @keypress.enter="saveEdit(task)"
                    @keyup.esc="cancelEdit(task)"
                    class="task-input active"
                    type="text"
                >

                <div class="task-actions">
                    <!-- TEMPLATE TAG: Used for grouping without extra DOM element -->
                    <!-- Unlike <div>, <template> doesn't render a wrapper element -->
                    <!-- Perfect for v-if when you don't want extra markup -->

                    <!-- DISPLAY MODE BUTTONS: Edit and Delete -->
                    <template v-if="!task.isEditing">
                        <!-- @CLICK with object parameter: Pass entire task object -->
                        <button @click="startEdit(task)" class="btn-edit">Edit</button>
                        <!-- @CLICK with id parameter: Pass just the ID -->
                        <button @click="deleteTask(task.id)" class="btn-delete">Delete</button>
                    </template>

                    <!-- EDIT MODE BUTTONS: Save and Cancel -->
                    <template v-if="task.isEditing">
                        <!-- @CLICK calling methods with object parameter -->
                        <button @click="saveEdit(task)" class="btn-save">Save</button>
                        <button @click="cancelEdit(task)" class="btn-cancel">Cancel</button>
                    </template>
                </div>
            </li>
        </ul>

        <div class="task-summary">
            <!-- COMPUTED PROPERTY BINDING: Reactive task count -->
            <!-- {{ taskCountText }} displays the computed property value -->
            <!-- This automatically updates when tasks array changes because: -->
            <!-- 1. taskCountText computed property depends on this.tasks -->
            <!-- 2. When tasks change (add/delete/toggle), Vue detects the dependency -->
            <!-- 3. Vue recalculates taskCountText -->
            <!-- 4. Vue updates this text content in the DOM -->
            <!-- No need for manual updateTaskCount() function! -->
            <span>{{ taskCountText }}</span>

            <!-- CLEAR COMPLETED OPERATION: Delete all completed tasks -->
            <!-- @CLICK event handler without parameters -->
            <!-- This demonstrates how Vue methods can work without parameters -->
            <!-- The method will access this.tasks directly from Vue instance -->
            <button @click="clearCompleted" class="btn btn-clear">Clear Completed</button>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="auth.js"></script>
    <script src="api-service.js"></script>
    <script src="vue-app.js"></script>
</body>
</html>
